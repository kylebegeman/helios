name: CI

on:
  push:
    branches: [next]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Format, vet, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: make check
        run: make check
      - name: Validate performance fixtures
        run: make bench-smoke BENCH_OUT=bin/benchmarks/ci-smoke
      - name: Build for the machines (linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /dev/null ./cmd/helios
      - name: Build for the Mac (darwin/arm64)
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /dev/null ./cmd/helios

  lane:
    name: Disposable Linux daemon recovery proof
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Set isolated lane state
        run: echo "LANE_VM_STATE=$RUNNER_TEMP/bedrock-lane" >> "$GITHUB_ENV"
      - name: Provision a dedicated Linux guest
        run: lane/vm.sh up
      - name: Prove daemon recovery
        run: lane/prove.sh --config "$LANE_VM_STATE/lane.env" --artifacts "$RUNNER_TEMP/lane-proof" m1
      - name: Capture guest boot diagnostics
        if: failure()
        run: |
          if test -f "$LANE_VM_STATE/machine.json"; then
            container=$(python3 -c 'import json,os; print(json.load(open(os.environ["LANE_VM_STATE"] + "/machine.json"))["container"])')
            mkdir -p "$RUNNER_TEMP/lane-proof"
            docker logs "$container" > "$RUNNER_TEMP/lane-proof/guest-boot.log" 2>&1 || true
          fi
      - name: Upload operational proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: disposable-linux-proof
          path: ${{ runner.temp }}/lane-proof
          if-no-files-found: warn
      - name: Remove the owned Linux guest
        if: always()
        run: |
          if test -f "$LANE_VM_STATE/machine.json"; then
            lane/vm.sh down
          fi
